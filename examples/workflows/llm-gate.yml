# Example for YOUR repository: gate every PR against the latest main-branch run.
# main pushes upload their run as an artifact; PRs download it and gate against it.
name: LLM gate
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
  pull-requests: write
  actions: read
jobs:
  baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install git+https://github.com/bprakashputta/assaygate@v1
      - run: assaygate run evals/suite.yaml --runs-dir runs --run-id baseline --label main
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - uses: actions/upload-artifact@v4
        with: {name: assaygate-baseline, path: runs/baseline, retention-days: 90}

  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dawidd6/action-download-artifact@v6
        with: {name: assaygate-baseline, branch: main, workflow: llm-gate.yml, path: baseline}
      - uses: bprakashputta/assaygate@v1
        with: {baseline: baseline, suite: evals/suite.yaml}
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
