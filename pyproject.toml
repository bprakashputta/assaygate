[project]
name = "assaygate"
version = "0.1.0"
description = "LLM evaluation and regression gating for CI: scorers, calibrated LLM judges, bootstrap CIs, and quality/cost/latency gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bhanu Prakash Putta" }]
keywords = ["llm", "evaluation", "llm-as-judge", "ci", "regression-testing", "anthropic"]
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.8",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "jsonschema>=4.22",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
assaygate = "assaygate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assaygate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS template strings read better unwrapped than split mid-markup.
"src/assaygate/report.py" = ["E501"]
