name: assaygate
description: Gate a pull request on LLM quality, $ cost and p95 latency against a baseline run, with bootstrap CIs; comments a summary on the PR.
branding: {icon: check-circle, color: orange}
inputs:
  baseline:
    description: Path to the baseline run folder (e.g. downloaded from the main branch's artifact).
    required: true
  candidate:
    description: Path to the candidate run folder. If empty, `suite` is run to produce it.
    required: false
    default: ""
  suite:
    description: Suite YAML (used to run the candidate and for gate thresholds).
    required: false
    default: ""
  comment:
    description: Post (or update) a PR comment with the summary.
    required: false
    default: "true"
outputs:
  passed:
    description: "'true' if every check passed."
    value: ${{ steps.gate.outputs.passed }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      with: {python-version: "3.12"}
    - name: Install assaygate
      shell: bash
      # Installs the exact version of this action (works for `uses: owner/assaygate@ref` and `./`).
      run: uv tool install "${{ github.action_path }}"
    - name: Run candidate suite
      if: inputs.candidate == ''
      shell: bash
      # Untrusted values (inputs, branch names) reach the shell only via env, never via ${{ }} in the script.
      env:
        SUITE: ${{ inputs.suite }}
        LABEL: ${{ github.head_ref || github.ref_name }}
      run: assaygate run "$SUITE" --runs-dir .assaygate-runs --run-id candidate --label "$LABEL"
    - name: Gate
      id: gate
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        SUITE: ${{ inputs.suite }}
      run: |
        CAND="$CANDIDATE"; [ -z "$CAND" ] && CAND=.assaygate-runs/candidate
        SUITE_ARG=(); [ -n "$SUITE" ] && SUITE_ARG=(--suite "$SUITE")
        set +e
        assaygate compare "$BASELINE" "$CAND" "${SUITE_ARG[@]}" \
          --markdown assaygate-summary.md --html assaygate-report.html --json assaygate-result.json
        code=$?
        set -e
        echo "passed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        { echo "<!-- assaygate -->"; cat assaygate-summary.md; } > body.md
        id=$(gh api "repos/$REPO/issues/$PR/comments" \
              --jq '.[] | select(.body | startswith("<!-- assaygate -->")) | .id' | head -1)
        if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
        else gh pr comment "$PR" --body-file body.md; fi
    - name: Fail on regression
      if: steps.gate.outputs.code != '0'
      shell: bash
      env: {CODE: "${{ steps.gate.outputs.code }}"}
      run: |
        if [ "$CODE" = "1" ]; then
          echo "::error::assaygate: regression detected (see summary / assaygate-report.html)"
        else
          echo "::error::assaygate failed to run (exit $CODE)"
        fi
        exit 1
